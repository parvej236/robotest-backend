server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=robotest-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# access  = 1 day  (24*60*60*1000) ms)
# refresh = 30 days  ( ms)
# reset   = 1 hour  (3_600_000 ms)
app.jwt.secret=RobotestVeryLongSecretKey2024_ChangeThisInProduction_MustBe32CharsMin!
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=2592000000

# Use an App Password from: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

app.base-url=http://localhost:8080
app.frontend-url=${FRONTEND_URL}

logging.level.com.robotest=DEBUG
logging.level.org.springframework.security=WARN

# Upload directory
app.upload.dir=uploads

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.jackson.time-zone=Asia/Dhaka
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka
